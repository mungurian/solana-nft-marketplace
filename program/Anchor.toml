[toolchain]
solana_version = "4.2.1"
package_manager = "pnpm"

[features]
resolution = true
skip-lint = false

[programs.localnet]
nft_marketplace = "C9RrLfoPdABJEM7C4xBnjjatjEpvJFyrqdyArPafVE2Q"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[surfpool]
online = true
datasource_rpc_url = "https://api.mainnet-beta.solana.com"
startup_wait = 10000

[scripts]
test = "pnpm exec ts-mocha -p ./tsconfig.json -t 1000000 \"tests/**/*.ts\""
test-list = "pnpm exec ts-mocha -p ./tsconfig.json -t 1000000 \"tests/list.ts\""
test-buy = "pnpm exec ts-mocha -p ./tsconfig.json -t 1000000 \"tests/buy.ts\""
test-delist = "pnpm exec ts-mocha -p ./tsconfig.json -t 1000000 \"tests/delist.ts\""
seed = "pnpm run seed"

[hooks]
